name: Bug
description: Algo não está funcionando
labels: ["bug", "triagem:pendente"]
body:
  - type: textarea
    id: resumo
    attributes:
      label: O que aconteceu
      description: Descreva o sintoma, não a causa presumida.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como ...
        2. Ir em ...
        3. Clicar em ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Esperado x obtido
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Área afetada
      description: "ADAPTAR: prefira dropdown com as áreas reais do projeto."
  - type: textarea
    id: evidencia
    attributes:
      label: Logs, prints e IDs
      description: Não inclua senhas, tokens ou dados pessoais.
